3x4+1R:
  description: "3×4 standard layout with lead II as rhythm lead"
  layout:
    rows: 3
    cols: 4
  leads:
    - ["I", "aVR", "V1", "V4"]
    - ["II", "aVL", "V2", "V5"]
    - ["III", "aVF", "V3", "V6"]
    - ["II", "II", "II", "II"]
  rhythm_leads: []
  total_rows: 4

6x4:
  description: "3×4 standard layout with 3 rhythm leads"
  layout:
    rows: 6
    cols: 4
  leads:
    - ["I", "aVR", "V1", "V4"]
    - ["II", "aVL", "V2", "V5"]
    - ["III", "aVF", "V3", "V6"]
    - ["V1", "V1", "V1", "V1"]
    - ["II", "II", "II", "II"]
    - ["V5", "V5", "V5", "V5"]
  rhythm_leads: []
  total_rows: 6

6x2_with_r1:
  description: "6×2 layout with 1 rhythm lead (II)"
  layout:
    rows: 6
    cols: 2
  leads:
    - ["I",   "V1"]
    - ["II",  "V2"]
    - ["III", "V3"]
    - ["aVR", "V4"]
    - ["aVL", "V5"]
    - ["aVF", "V6"]
  rhythm_leads: ["II"]
  total_rows: 7

